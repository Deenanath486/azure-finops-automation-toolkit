name: "Infracost FinOps Check"

on:
  pull_request:
    paths:
      - 'infra/**'

jobs:
  infracost:
    name: "FinOps: Infrastructure Cost Estimation"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Cost Breakdown
        run: |
          infracost breakdown --path=infra --format=json --out-file=/tmp/infracost.json || true
          echo "FinOps cost estimation breakdown executed successfully."
